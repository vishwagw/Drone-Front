# Fly.io deployment: one machine in Chicago (ord), central to the US, with a volume for
# the SQLite database. Keep one machine: SQLite allows a single writer.
app = "drone-front"
primary_region = "ord"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "drone_front_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
